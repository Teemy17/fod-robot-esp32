; Encoderless yellow TT prototype; see README for serial dialect.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter = +<main.cpp> +<motor.cpp> +<protocol.cpp>

build_flags =
    -D CORE_DEBUG_LEVEL=2
    -std=gnu++17
build_unflags =
    -std=gnu++11

monitor_filters = esp32_exception_decoder

; Standalone, manually triggered one-second motor tests over USB serial.
[env:motor_test]
extends = env:esp32dev
build_src_filter = +<motor_test.cpp> +<motor.cpp>

; Direct digital GPIO test: full duty, no PWM peripheral or motor wrapper.
[env:motor_gpio_test]
extends = env:esp32dev
build_src_filter = +<motor_gpio_test.cpp>

; Nav-compatible build: protocol v1 (V/T/I), encoders, closed-loop wheel speed. This is
; the firmware fod-robot-pathing (nav) can talk to. The default env above (esp32dev, the
; v2 bench prototype) is unchanged. -D ROBOT_CONSTANTS_MEASURED=1 makes the handshake
; report the measured geometry in include/robot_v1.h. Keep the esp32dev flags: a
; build_flags line replaces the inherited one.
[env:nav_v1]
extends = env:esp32dev
build_src_filter = +<main_v1.cpp> +<motor.cpp> +<protocol.cpp> +<protocol_v1.cpp> +<encoders.cpp>
build_flags =
    ${env:esp32dev.build_flags}
    -D ROBOT_CONSTANTS_MEASURED=1

; nav_v1 plus a 25 Hz "L D tune ..." line (setpoint, measured, duty, encoder errors per
; wheel) for tuning the wheel-speed loop. The Pi ignores L lines.
[env:nav_v1_tuning]
extends = env:nav_v1
build_flags =
    ${env:nav_v1.build_flags}
    -D PID_TUNING
