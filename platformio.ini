; fod-robot-esp32 -- motor + sensor firmware, ESP32 side of docs/protocol.md
; (that document lives in the fod-robot-pathing repo; copy it into docs/ here
; too, verbatim, per its own header: "drop a copy in each [repo]").

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=2
    -std=gnu++17
build_unflags =
    -std=gnu++11

; VL53L0X ToF driver -- wire in when the sensor code in src/tof.cpp is
; filled in (PRD FR-10 / BOM: 2-4x VL53L0X, XSHUT for address assignment).
lib_deps =
    pololu/VL53L0X @ ^1.3.1

monitor_filters = esp32_exception_decoder
