; Encoderless yellow TT prototype; see README for serial dialect.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter = +<main.cpp> +<motor.cpp> +<protocol.cpp>

build_flags =
    -D CORE_DEBUG_LEVEL=2
    -std=gnu++17
build_unflags =
    -std=gnu++11

monitor_filters = esp32_exception_decoder

; Standalone, manually triggered one-second motor tests over USB serial.
[env:motor_test]
extends = env:esp32dev
build_src_filter = +<motor_test.cpp> +<motor.cpp>

; Direct digital GPIO test: full duty, no PWM peripheral or motor wrapper.
[env:motor_gpio_test]
extends = env:esp32dev
build_src_filter = +<motor_gpio_test.cpp>
